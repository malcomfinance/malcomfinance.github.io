<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Malcom Finance · Interactive Guide</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-main: #f9fafb; --bg-card: #ffffff; --text-main: #111827; --text-muted: #6b7280;
            --border-color: #e5e7eb; --accent-green: #059669; --accent-soft: #ecfdf5; --input-bg: #f3f4f6;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
            height: 100vh;
        }

        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 2rem; }
        .accent-bg { background-color: var(--accent-green); }
        .accent-text { color: var(--accent-green); }
        .input-group { background-color: var(--input-bg); border: 1px solid var(--border-color); position: relative; }

        /* THE BLACK OVERLAY LAYER */
        #global-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 5000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        body.simulating #global-overlay { opacity: 1; }

        /* BRINGING FOCUS ABOVE OVERLAY */
        .active-focus {
            position: relative !important;
            z-index: 6000 !important;
            box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.1), 0 20px 25px -5px rgba(0, 0, 0, 0.2) !important;
            background-color: white !important;
            transform: scale(1.02);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* TOOLTIP BUBBLE */
        #guide-tooltip {
            position: fixed;
            z-index: 7000;
            background: #111827;
            color: white;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            width: 240px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #guide-tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #111827;
        }

        /* FLOATING CONTROLS */
        #guide-controls {
            position: fixed;
            bottom: 340px; /* Above keyboard */
            left: 50%;
            transform: translateX(-50%);
            z-index: 8000;
            display: flex;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 100px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* VIRTUAL KEYBOARD */
        #virtual-keyboard {
            position: fixed;
            bottom: -350px;
            left: 0; right: 0;
            background: #d1d5db;
            padding: 6px 4px 20px 4px;
            border-top: 1px solid #adb5bd;
            transition: bottom 0.4s cubic-bezier(0.33, 1, 0.68, 1);
            z-index: 9000;
        }
        .kb-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 5px; }
        .key {
            background: #fff;
            border-radius: 5px;
            height: 44px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 1rem;
            box-shadow: 0 1px 0 #888;
        }
        .key.active { background: #adb5bd; transform: translateY(2px); box-shadow: none; }
        .key-special { background: #adb5bd; font-size: 0.75rem; flex: 1.5; }
    </style>
</head>
<body class="simulating">

    <div id="global-overlay"></div>
    <div id="guide-tooltip">Welcome to the guide!</div>

    <!-- FLOATING NAV -->
    <div id="guide-controls">
        <button id="btn-prev" class="px-4 py-2 rounded-full bg-gray-100 text-gray-400 text-xs font-bold transition hover:bg-gray-200">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </button>
        <div class="h-8 w-px bg-gray-200"></div>
        <button id="btn-next" class="px-6 py-2 rounded-full bg-green-600 text-white text-xs font-bold transition hover:bg-green-700 shadow-md shadow-green-200">
            Next <i class="fas fa-arrow-right ml-1"></i>
        </button>
    </div>

    <!-- MAIN APP VIEW -->
    <div class="flex flex-col items-center justify-center min-h-screen px-6 pb-20">
        <div class="text-center mb-8" id="header-brand">
            <div class="w-16 h-16 accent-bg rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg">
                <i class="fas fa-leaf"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight">Malcom Finance</h1>
            <p class="text-muted text-sm mt-2 font-medium">Secure Wealth Management</p>
        </div>

        <div class="card p-8 shadow-xl bg-white w-full max-w-sm" id="auth-card">
            <!-- Login -->
            <div id="login-view">
                <h2 class="text-xl font-bold mb-6">Welcome Back</h2>
                <div class="space-y-4">
                    <div id="box-l-email" class="input-group flex items-center p-4 rounded-2xl">
                        <i class="fas fa-envelope text-muted mr-3"></i>
                        <input type="text" id="l-email" class="w-full text-sm outline-none" placeholder="Email Address" readonly>
                    </div>
                    <div id="box-l-pwd" class="input-group flex items-center p-4 rounded-2xl">
                        <i class="fas fa-lock text-muted mr-3"></i>
                        <input type="password" id="l-pwd" class="w-full text-sm outline-none" placeholder="Password" readonly>
                        <i class="fas fa-eye text-muted" id="l-eye"></i>
                    </div>
                    <button id="l-btn" class="w-full accent-bg text-white font-bold py-4 rounded-2xl shadow-lg">Sign In</button>
                </div>
                <p class="text-center text-sm text-muted mt-6">New here? <span id="to-signup" class="accent-text font-bold">Create account</span></p>
            </div>

            <!-- Signup -->
            <div id="signup-view" class="hidden">
                <h2 class="text-xl font-bold mb-6 text-center">Join Malcom</h2>
                <div class="space-y-3">
                    <div id="box-s-name" class="input-group flex items-center p-3.5 rounded-2xl">
                        <i class="fas fa-user text-muted mr-3"></i>
                        <input type="text" id="s-name" class="w-full text-sm outline-none" placeholder="Full Name" readonly>
                    </div>
                    <div id="box-s-email" class="input-group flex items-center p-3.5 rounded-2xl">
                        <i class="fas fa-envelope text-muted mr-3"></i>
                        <input type="text" id="s-email" class="w-full text-sm outline-none" placeholder="Email Address" readonly>
                    </div>
                    <div id="box-s-phone" class="input-group flex items-center p-3.5 rounded-2xl">
                        <i class="fas fa-phone text-muted mr-3"></i>
                        <input type="text" id="s-phone" class="w-full text-sm outline-none" placeholder="Phone Number" readonly>
                    </div>
                    <div id="box-s-pwd" class="input-group flex items-center p-3.5 rounded-2xl">
                        <i class="fas fa-lock text-muted mr-3"></i>
                        <input type="password" id="s-pwd" class="w-full text-sm outline-none" placeholder="Password" readonly>
                        <i class="fas fa-eye text-muted" id="s-eye"></i>
                    </div>
                    <div id="box-s-ref" class="input-group flex items-center p-3.5 rounded-2xl">
                        <i class="fas fa-user-friends text-muted mr-3"></i>
                        <input type="text" id="s-ref" class="w-full text-sm outline-none" placeholder="Referral Code" readonly>
                    </div>
                    <button id="s-btn" class="w-full accent-bg text-white font-bold py-4 rounded-2xl mt-2 shadow-lg">Get Started</button>
                </div>
                <p class="text-center text-sm text-muted mt-4">Have an account? <span id="to-login" class="accent-text font-bold">Sign in</span></p>
            </div>
        </div>
    </div>

    <!-- SIMULATED KEYBOARD -->
    <div id="virtual-keyboard">
        <div class="kb-row">
            <div class="key" data-k="1">1</div><div class="key" data-k="2">2</div><div class="key" data-k="3">3</div><div class="key" data-k="4">4</div><div class="key" data-k="5">5</div><div class="key" data-k="6">6</div><div class="key" data-k="7">7</div><div class="key" data-k="8">8</div><div class="key" data-k="9">9</div><div class="key" data-k="0">0</div>
        </div>
        <div class="kb-row">
            <div class="key" data-k="q">q</div><div class="key" data-k="w">w</div><div class="key" data-k="e">e</div><div class="key" data-k="r">r</div><div class="key" data-k="t">t</div><div class="key" data-k="y">y</div><div class="key" data-k="u">u</div><div class="key" data-k="i">i</div><div class="key" data-k="o">o</div><div class="key" data-k="p">p</div>
        </div>
        <div class="kb-row">
            <div class="key" data-k="a">a</div><div class="key" data-k="s">s</div><div class="key" data-k="d">d</div><div class="key" data-k="f">f</div><div class="key" data-k="g">g</div><div class="key" data-k="h">h</div><div class="key" data-k="j">j</div><div class="key" data-k="k">k</div><div class="key" data-k="l">l</div>
        </div>
        <div class="kb-row">
            <div class="key key-special">Shift</div><div class="key" data-k="z">z</div><div class="key" data-k="x">x</div><div class="key" data-k="c">c</div><div class="key" data-k="v">v</div><div class="key" data-k="b">b</div><div class="key" data-k="n">n</div><div class="key" data-k="m">m</div><div class="key key-special">Del</div>
        </div>
        <div class="kb-row">
            <div class="key key-special">123</div><div class="key" data-k="@">@</div><div class="key flex-[4]" data-k=" ">Space</div><div class="key" data-k=".">.</div><div class="key key-special bg-green-600 text-white border-0 font-bold">Go</div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const wait = (ms) => new Promise(r => setTimeout(r, ms));

        // --- UI HELPERS ---
        function setFocus(selector, text) {
            document.querySelectorAll('.active-focus').forEach(el => el.classList.remove('active-focus'));
            const tip = document.getElementById('guide-tooltip');
            
            if (selector) {
                const el = document.querySelector(selector);
                el.classList.add('active-focus');
                
                // Position Tooltip
                const rect = el.getBoundingClientRect();
                tip.innerText = text;
                tip.style.opacity = '1';
                tip.style.left = (rect.left + rect.width / 2 - 120) + 'px';
                tip.style.top = (rect.top - 70) + 'px';
            } else {
                tip.style.opacity = '0';
            }
        }

        async function tapKey(char) {
            const key = document.querySelector(`.key[data-k="${char.toLowerCase()}"]`) || document.querySelector(`.key[data-k=" "]`);
            if (key) {
                key.classList.add('active');
                await wait(150);
                key.classList.remove('active');
            }
        }

        async function simType(inputSelector, text) {
            const input = document.querySelector(inputSelector);
            input.value = "";
            for (let char of text) {
                await tapKey(char);
                input.value += char;
                await wait(100);
            }
        }

        function showKB(show) {
            document.getElementById('virtual-keyboard').style.bottom = show ? "0px" : "-350px";
            document.getElementById('guide-controls').style.bottom = show ? "340px" : "40px";
        }

        function togglePwd(id, iconId) {
            const input = document.getElementById(id);
            const icon = document.getElementById(iconId);
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        }

        // --- STEPS CONFIG ---
        const steps = [
            {
                tip: "Tap here to create your new account.",
                action: async () => {
                    setFocus("#to-signup", "Tap here to create your new account.");
                    await wait(1000);
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('signup-view').classList.remove('hidden');
                }
            },
            {
                tip: "Start by entering your full legal name.",
                action: async () => {
                    setFocus("#box-s-name", "Start by entering your full legal name.");
                    showKB(true);
                    await simType("#s-name", "John Sterling");
                }
            },
            {
                tip: "Enter your primary email address.",
                action: async () => {
                    setFocus("#box-s-email", "Enter your primary email address.");
                    await simType("#s-email", "john@sterling.com");
                }
            },
            {
                tip: "Provide a valid mobile number.",
                action: async () => {
                    setFocus("#box-s-phone", "Provide a valid mobile number.");
                    await simType("#s-phone", "0712345678");
                }
            },
            {
                tip: "Create a strong password.",
                action: async () => {
                    setFocus("#box-s-pwd", "Create a strong password.");
                    await simType("#s-pwd", "SecurePass123");
                    await wait(400);
                    setFocus("#s-eye", "Tap to verify your typing.");
                    togglePwd('s-pwd', 's-eye');
                    await wait(800);
                    togglePwd('s-pwd', 's-eye');
                }
            },
            {
                tip: "Use the referral code AABYGHUR here.",
                action: async () => {
                    setFocus("#box-s-ref", "Use the referral code AABYGHUR here.");
                    await simType("#s-ref", "AABYGHUR");
                    showKB(false);
                }
            },
            {
                tip: "Tap 'Get Started' to register.",
                action: async () => {
                    setFocus("#s-btn", "Tap 'Get Started' to register.");
                    await wait(1000);
                    document.getElementById('signup-view').classList.add('hidden');
                    document.getElementById('login-view').classList.remove('hidden');
                }
            },
            {
                tip: "To login, enter your registered email.",
                action: async () => {
                    setFocus("#box-l-email", "To login, enter your registered email.");
                    showKB(true);
                    await simType("#l-email", "john@sterling.com");
                    setFocus("#box-l-pwd", "And your secure password.");
                    await simType("#l-pwd", "SecurePass123");
                    showKB(false);
                }
            },
            {
                tip: "Tap 'Sign In' to access your portal.",
                action: async () => {
                    setFocus("#l-btn", "Tap 'Sign In' to access your portal.");
                    document.getElementById('btn-next').innerText = "Finish";
                }
            }
        ];

        async function runStep(index) {
            const step = steps[index];
            document.getElementById('btn-prev').classList.toggle('opacity-30', index === 0);
            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').innerText = index === steps.length - 1 ? "Finish" : "Next";
            await step.action();
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentStep === steps.length - 1) {
                window.history.back();
                return;
            }
            currentStep++;
            runStep(currentStep);
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                if (currentStep === 0) {
                    document.getElementById('signup-view').classList.add('hidden');
                    document.getElementById('login-view').classList.remove('hidden');
                }
                runStep(currentStep);
            }
        });

        window.onload = () => {
            document.getElementById('guide-controls').style.opacity = '1';
            setTimeout(() => runStep(0), 1000);
        };
    </script>
</body>
</html>
